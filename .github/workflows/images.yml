name: Build and publish images

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "agent/**"
      - "control-plane/**"
      - "dashboard/**"
      - "deploy/**"
      - "third_party/**"
      - ".github/workflows/images.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-publish-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-agent:
    name: Build neilico-agent
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/aceneil/neilico-agent
          flavor: latest=false
          tags: |
            type=raw,value=latest
            type=sha,format=short,prefix=sha-

      - name: Build and push neilico-agent
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/agent/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha,scope=neilico-agent
          cache-to: type=gha,scope=neilico-agent,mode=max

      - name: Write neilico-agent digest to summary
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "## neilico-agent image"
            echo
            echo "- Image: \`ghcr.io/aceneil/neilico-agent:latest\`"
            echo "- Digest: \`$DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"

  build-allinone:
    name: Build neilico-allinone
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify vendored RustDesk dependencies
        run: |
          set -euo pipefail
          test -f third_party/rustdesk-server/vendor.tar.gz
          test -f third_party/rustdesk-server/.cargo/config.toml
          grep -Fq 'ENV CARGO_NET_OFFLINE=true' deploy/allinone/Dockerfile
          grep -Fq 'cargo build --release --offline' deploy/allinone/Dockerfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/aceneil/neilico-allinone
          flavor: latest=false
          tags: |
            type=raw,value=latest
            type=sha,format=short,prefix=sha-

      - name: Build and push neilico-allinone
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/allinone/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha,scope=neilico-allinone
          cache-to: type=gha,scope=neilico-allinone,mode=max

      - name: Write neilico-allinone digest to summary
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "## neilico-allinone image"
            echo
            echo "- Image: \`ghcr.io/aceneil/neilico-allinone:latest\`"
            echo "- Digest: \`$DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"
