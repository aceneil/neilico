events { worker_connections 4096; }
http {
    access_log off;
    sendfile on;

    upstream bench_up { server 127.0.0.1:19090; keepalive 64; }

    server {
        listen 19091;
        location / {
            proxy_pass http://bench_up;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
        }
    }
}
