name: neilico_desktop
description: "NEILICO 桌面客户端 —— 设备管理端（远程桌面 / Mesh / 隧道开关）"
# 私有项目：禁止误发布到 pub.dev。
publish_to: 'none'

# 版本号语义：三段的 <major>.<minor>.<patch>，可附 +构建号。
version: 0.1.0+1

environment:
  sdk: ^3.13.2

# 依赖保持轻量：不引大而全的状态管理/路由框架。
#   - http：唯一的网络依赖（控制面 REST 接口）。
#   - flutter_secure_storage：令牌安全存储（macOS Keychain / Windows DPAPI /
#     Linux libsecret）。绝不把令牌明文写进磁盘。
#   - window_manager：桌面窗口初始化（标题/最小尺寸/居中），三端共用。
dependencies:
  flutter:
    sdk: flutter

  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  window_manager: ^0.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
