apiVersion: v1
kind: Service
metadata:
  name: {{ include "neilico.controlApi.fullname" . }}
  labels:
    {{- include "neilico.componentLabels" (dict "root" . "component" "control-api") | nindent 4 }}
  annotations:
    {{- include "neilico.annotations" . | nindent 4 }}
    {{- with .Values.controlApi.service.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  type: {{ .Values.controlApi.service.type }}
  selector:
    {{- include "neilico.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: control-api
  ports:
    - name: api
      port: {{ .Values.controlApi.service.ports.api }}
      targetPort: api
      protocol: TCP
    - name: proxy
      port: {{ .Values.controlApi.service.ports.proxy }}
      targetPort: proxy
      protocol: TCP
    - name: tls
      port: {{ .Values.controlApi.service.ports.tls }}
      targetPort: tls
      protocol: TCP
---
