{{- if and .Values.relay.enabled (eq .Values.relay.exposure "nodePort") }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "neilico.relay.fullname" . }}
  labels:
    {{- include "neilico.componentLabels" (dict "root" . "component" "relay") | nindent 4 }}
  annotations:
    {{- include "neilico.annotations" . | nindent 4 }}
    {{- with .Values.relay.service.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  type: NodePort
  selector:
    {{- include "neilico.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: relay
  ports:
    - name: wireguard
      port: {{ .Values.relay.service.wireguardPort }}
      targetPort: wireguard
      protocol: UDP
      {{- if gt (int .Values.relay.service.wireguardNodePort) 0 }}
      nodePort: {{ .Values.relay.service.wireguardNodePort }}
      {{- end }}
    - name: turn
      port: {{ .Values.relay.service.turnPort }}
      targetPort: turn
      protocol: UDP
      {{- if gt (int .Values.relay.service.turnNodePort) 0 }}
      nodePort: {{ .Values.relay.service.turnNodePort }}
      {{- end }}
{{- end }}
