{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "neilico.serviceAccountName" . }}
  labels:
    {{- include "neilico.componentLabels" (dict "root" . "component" "service-account") | nindent 4 }}
  annotations:
    {{- include "neilico.annotations" . | nindent 4 }}
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
automountServiceAccountToken: false
{{- end }}
