{{- if and .Values.secrets.create (not .Values.secrets.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "neilico.secretName" . }}
  labels:
    {{- include "neilico.componentLabels" (dict "root" . "component" "control-api") | nindent 4 }}
  annotations:
    {{- include "neilico.annotations" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.secrets.keys.postgresPassword }}: {{ .Values.secrets.postgresPassword | quote }}
  {{ .Values.secrets.keys.jwtSecret }}: {{ .Values.secrets.jwtSecret | quote }}
  {{ .Values.secrets.keys.bootstrapAdminPassword }}: {{ .Values.secrets.bootstrapAdminPassword | quote }}
  {{- if .Values.alerts.webhook.enabled }}
  {{ .Values.secrets.keys.webhookUrl }}: {{ .Values.alerts.webhook.url | quote }}
  {{- end }}
{{- end }}
