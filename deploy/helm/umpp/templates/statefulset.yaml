        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if .Values.nats.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "umpp.componentLabels" (dict "root" . "component" "nats") | nindent 10 }}
        annotations:
          {{- include "umpp.annotations" . | nindent 10 }}
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.nats.persistence.size }}
        {{- with .Values.nats.persistence.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
  {{- end }}
