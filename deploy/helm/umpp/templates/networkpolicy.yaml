{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "umpp.fullname" . }}
  labels:
    {{- include "umpp.componentLabels" (dict "root" . "component" "network-policy") | nindent 4 }}
  annotations:
    {{- include "umpp.annotations" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "umpp.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: {{ .Values.controlApi.service.ports.api }}
        - protocol: TCP
          port: {{ include "umpp.proxyPort" . }}
        - protocol: TCP
          port: {{ include "umpp.tlsPort" . }}
        - protocol: TCP
          port: {{ .Values.dashboard.service.port }}
        {{- if .Values.relay.enabled }}
        - protocol: UDP
          port: {{ .Values.relay.service.wireguardPort }}
        - protocol: UDP
          port: {{ .Values.relay.service.turnPort }}
        {{- end }}
    {{- with .Values.networkPolicy.ingress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  egress:
    {{- if .Values.networkPolicy.allowExternalEgress }}
    - {}
    {{- else }}
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: {{ include "umpp.postgresPort" . }}
        - protocol: TCP
          port: {{ .Values.externalRedis.port }}
        - protocol: TCP
          port: {{ .Values.externalNATS.port }}
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 443
    {{- end }}
    {{- with .Values.networkPolicy.egress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
