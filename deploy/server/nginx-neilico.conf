# NEILICO — 已有 Nginx 时的接入配置
# ---------------------------------------------------------------------------
# 适用场景：服务器上已经跑着 Nginx（或宝塔/1Panel 自带的），不想再起一个 Caddy。
#
# 做法：compose 里删掉 caddy 服务，把容器端口只绑到回环地址：
#
#   services:
#     server:
#       # 不是 expose，而是只给本机 nginx 用
#       ports:
#         - "127.0.0.1:8080:8080"    # 面板 + /api/v1
#         - "127.0.0.1:8081:8081"    # 域名反代
#
# 然后把下面两段放进 /etc/nginx/conf.d/neilico.conf，nginx -t && nginx -s reload
# ---------------------------------------------------------------------------

# ① 控制面（面板 + API）
upstream neilico_panel {
    server 127.0.0.1:8080;
    keepalive 16;
}

# ② 业务域名（由 NEILICO 内置反代接管，按 NEILICO 里登记的域名再分发）
upstream neilico_proxy {
    server 127.0.0.1:8081;
    keepalive 16;
}

# ── 控制面域名 ─────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name neilico.example.com;

    # 上了证书后改成 443 + ssl_certificate（或用 certbot --nginx 自动改）
    client_max_body_size 512m;

    location / {
        proxy_pass http://neilico_panel;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 前端是 SPA + 长连接（日志/事件流）时别让它被缓冲
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}

# ── 业务域名（每个域名一段，统一交给 8081）──────────────────────────────────
server {
    listen 80;
    server_name app.example.com;

    client_max_body_size 512m;

    location / {
        proxy_pass http://neilico_proxy;
        proxy_http_version 1.1;
        # Host 必须原样透传：NEILICO 的反代规则就是按 Host 匹配的
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}

# ── 证书 ───────────────────────────────────────────────────────────────────
# 已有 certbot：certbot --nginx -d neilico.example.com -d app.example.com
# 已有宝塔/1Panel：在面板里给这两个站点签发 Let's Encrypt 即可。
#
# 注意：
#   · NEILICO_ENROLL_PUBLIC_URL 要写成用户实际访问的 https 地址，
#     否则「接入设备」生成的命令里地址是错的，设备接不回来。
#   · 业务域名必须先加进本文件（server_name），再在 NEILICO 控制台里登记同名域名。
