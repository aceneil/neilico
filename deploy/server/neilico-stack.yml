# NEILICO — 单容器部署（面板直接监听 11333）
# ---------------------------------------------------------------------------
#   docker compose -f neilico-stack.yml up -d
#   面板：http://<IP>:11333
#
# 不拆分第二个容器：面板进程本身监听 11333，端口映射 1:1，容器内外都是 11333。
# 数据在具名卷 neilico_pg，删容器不丢；**不要 down -v**。
# ---------------------------------------------------------------------------
name: neilico

services:
  server:
    image: ghcr.io/aceneil/neilico-server:latest
    container_name: neilico
    restart: unless-stopped
    ports:
      - "11333:11333"
    environment:
      # ① 必填：数据库密码，缺了容器直接退出
      POSTGRES_PASSWORD: "neilico"
      # ② 无需配置：留空即用「你打开面板时的地址」生成接入命令。
      #    只有在反向代理后面、或设备应走另一个域名时才需要显式指定：
      #    NEILICO_ENROLL_PUBLIC_URL: "https://neilico.example.com"
      # ③ 留空 = 首次打开页面时注册管理员
      #    （不写这两行会用镜像内置的 admin@example.com 占位账号）
      NEILICO_BOOTSTRAP_ADMIN_EMAIL: ""
      NEILICO_BOOTSTRAP_ADMIN_PASSWORD: ""
    volumes:
      # 相对 docker-compose.yml 所在目录；首次启动会自动建目录并修正属主
      - ./neilico/data:/var/lib/postgresql/data
      - ./neilico/state:/var/lib/neilico
      # 「反向代理」页要识别 Docker 里已有的 nginx/caddy，必须能看到 docker.sock；
      # 只读即可探测，写入/热重载需要可写 + NEILICO_WEBPROXY_WRITE=1
      - /var/run/docker.sock:/var/run/docker.sock:ro

