# NEILICO — 精简部署（一个端口 11333）
# ---------------------------------------------------------------------------
#   docker compose -f neilico-stack.yml up -d
#   面板：http://<IP>:11333
#
# 只留 3 项真正需要填的设置，其余全部走镜像内置默认值。
# 数据在具名卷 neilico_pg，删容器不丢；**不要 down -v**。
# ---------------------------------------------------------------------------
name: neilico

services:
  server:
    image: ghcr.io/aceneil/neilico-server:latest
    container_name: neilico
    restart: unless-stopped
    expose:
      - "8080"
      - "8081"
    environment:
      # ① 必填：数据库密码，缺了容器直接退出
      POSTGRES_PASSWORD: "neilico"
      # ② 设备接入命令里回连的地址（换成你的 IP 或域名）
      NEILICO_ENROLL_PUBLIC_URL: "http://your-ip-or-domain:11333"
      # ③ 留空 = 首次打开页面时注册管理员
      #    （不写这两行会用镜像内置的 admin@example.com 占位账号）
      NEILICO_BOOTSTRAP_ADMIN_EMAIL: ""
      NEILICO_BOOTSTRAP_ADMIN_PASSWORD: ""
    volumes:
      - neilico_pg:/var/lib/postgresql/data
      - neilico_state:/var/lib/neilico
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/healthz >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 40s

  caddy:
    image: caddy:2-alpine
    container_name: neilico-caddy
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "11333:11333"
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile

configs:
  caddyfile:
    content: |
      :11333 {
        # 有业务域名要反代时，把下面三行注释放开并改成你的域名
        # @biz host app.example.com
        # handle @biz { reverse_proxy server:8081 }

        handle {
          reverse_proxy server:8080
        }
      }

volumes:
  neilico_pg:
  neilico_state:

