# NEILICO — 公网服务器部署（Caddy 终止 TLS + 单容器控制面）
# ---------------------------------------------------------------------------
# 目录约定（都放在 /opt/neilico 下）：
#   docker-compose.yml   本文件
#   neilico.env          控制面环境变量（见 neilico.env.public.example）
#   Caddyfile            反向代理配置
#   data/pg              PostgreSQL 数据（**不要删**）
#   data/rustdesk        RustDesk 密钥（**不要删**，丢了所有客户端要重配）
#   data/downloads       agent / 客户端安装包
#   data/caddy           证书与 ACME 状态
#
# 启动：docker compose up -d
# 自检：curl -fsS https://<你的域名>/healthz
# ---------------------------------------------------------------------------
name: neilico

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  server:
    # 生产建议固定版本：ghcr.io/aceneil/neilico-server:sha-<commit>
    image: ghcr.io/aceneil/neilico-server:latest
    container_name: neilico
    restart: unless-stopped
    env_file:
      - ./neilico.env
    environment:
      PGDATA: /var/lib/postgresql/data
      NEILICO_DATABASE_DRIVER: postgres
      NEILICO_SERVER_HOST: 0.0.0.0
      NEILICO_SERVER_DASHBOARD_DIR: /opt/neilico/dashboard
      NEILICO_SERVER_DASHBOARD_SPA: "true"
      NEILICO_DOWNLOADS_DIR: /usr/local/share/neilico/downloads
      NEILICO_BOOTSTRAP_ENV_FILE: /opt/neilico/bootstrap.env
      # 内置反代（域名 → 节点）监听容器内 8081，由 Caddy 转发进来
      NEILICO_PROXY_LISTEN: ":8081"
      NEILICO_STREAM_PORT_MIN: "${NEILICO_STREAM_PORT_MIN:-20000}"
      NEILICO_STREAM_PORT_MAX: "${NEILICO_STREAM_PORT_MAX:-20019}"
    # 8080/8081 只在 docker 网络内暴露给 Caddy，不映射到公网
    expose:
      - "8080"
      - "8081"
    ports:
      # 端口转发区间：规则里选了哪个端口，外部就从哪个端口进来
      - "${NEILICO_STREAM_PORT_MIN:-20000}-${NEILICO_STREAM_PORT_MAX:-20019}:${NEILICO_STREAM_PORT_MIN:-20000}-${NEILICO_STREAM_PORT_MAX:-20019}/tcp"
      - "${NEILICO_STREAM_PORT_MIN:-20000}-${NEILICO_STREAM_PORT_MAX:-20019}:${NEILICO_STREAM_PORT_MIN:-20000}-${NEILICO_STREAM_PORT_MAX:-20019}/udp"
      # 自托管 RustDesk（hbbs/hbbr）；未启用远程桌面时这些端口不监听属正常
      - "21115:21115/tcp"
      - "21116:21116/tcp"
      - "21116:21116/udp"
      - "21117:21117/tcp"
      - "21118:21118/tcp"
      - "21119:21119/tcp"
    volumes:
      - ./data/pg:/var/lib/postgresql/data
      - ./neilico.env:/opt/neilico/bootstrap.env
      - ./data/rustdesk:/var/lib/neilico/rustdesk
      - ./data/downloads:/usr/local/share/neilico/downloads
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/healthz >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 40s
    logging: *default-logging

  caddy:
    image: caddy:2-alpine
    container_name: neilico-caddy
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy/data:/data
      - ./data/caddy/config:/config
    logging: *default-logging
