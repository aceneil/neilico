server: https://api.umpp.example.com
token: ""
node:
  name: nas-01
  tags: ["home", "nas"]
mesh:
  interface: wg0
  mtu: 1420
  listen_port: 51820
  public_endpoint: ""
  cleanup_on_exit: true
  allow_forwarding: false
  external_interface: ""
proxy:
  enabled: false
  nps_server: nps.example.com:8024
metrics:
  enabled: true
  listen: 0.0.0.0:9100
log:
  level: info
state_path: /var/lib/umpp-agent/state.json
poll_interval: 30s
heartbeat_interval: 30s
