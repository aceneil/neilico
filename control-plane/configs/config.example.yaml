server:
  host: "0.0.0.0"
  port: 8080
  dashboard_dir: ""          # empty disables static dashboard serving
  dashboard_spa: true        # fallback to index.html for extensionless SPA routes
  tls:
    enabled: false
    cert_file: ""
    key_file: ""
    client_ca_file: ""
    min_version: "1.2"
    redirect_http: true
    client_auth: "none"
    http_port: 80
pki:
  enabled: false
  ca_common_name: "NEILICO Internal CA"
  server_hosts: ["localhost", "127.0.0.1"]
  server_cert_days: 825
  node_cert_days: 365
  renew_before_days: 30
database:
  driver: postgres
  dsn: "postgres://neilico:change-me@localhost:5432/neilico?sslmode=disable"
auth:
  jwt_secret: "replace-with-a-long-random-secret"
  access_ttl: 15m
  refresh_ttl: 168h
bootstrap:
  admin_email: "admin@example.com"
  admin_password: "replace-with-a-strong-password"
  default_tenant: "default"
  # 首次登入引导 env 文件：轮换密码/改邮箱后原子回写该文件的
  # NEILICO_BOOTSTRAP_ADMIN_PASSWORD / NEILICO_BOOTSTRAP_ADMIN_EMAIL 键。空=不启用回写。
  env_file: "/opt/neilico/bootstrap.env"
node:
  heartbeat_timeout: 60s
enroll:
  signing_key: ""       # empty derives a stable HMAC key from auth.jwt_secret
  public_url: ""        # empty uses the request Host/scheme; set behind reverse proxies
  agent_image: "ghcr.io/aceneil/neilico-agent:latest"
                        # 接入命令里 docker run 用的镜像；必须是**目标机能拉到**的地址
                        # （早先用本机 tag neilico-agent:local，别的机器必然 pull 失败）
downloads:
  # /downloads/{filename} 的服务目录（agent 二进制 + 自有客户端发布包）。
  # 环境变量 NEILICO_DOWNLOADS_DIR 可覆盖；单容器部署里由宿主 data/neilico/downloads/ 绑定挂载。
  dir: "/usr/local/share/neilico/downloads"
ratelimit:
  enabled: true
  rps: 20
  burst: 40

# 「远程桌面」：自托管 RustDesk 服务端（hbbs 信令 + hbbr 中继）的接入与生命周期参数。
# hbbs/hbbr 由 allinone 镜像从本仓 vendored 源码自编译，控制面作为进程监管者**按需**拉起/回收。
# 控制面只读取 public_key_file（或 key_dir 派生的 **公钥** id_ed25519.pub），绝不下发私钥。
# 所有值均可用环境变量覆盖：NEILICO_RD_ENABLED / NEILICO_RD_ID_SERVER /
# NEILICO_RD_RELAY_SERVER / NEILICO_RD_PUBLIC_KEY_FILE / NEILICO_RD_PORTS /
# NEILICO_RD_SERVER_MODE / NEILICO_RD_IDLE_TIMEOUT / NEILICO_RD_KEY_DIR /
# NEILICO_RD_HBBS_PATH / NEILICO_RD_HBBR_PATH / NEILICO_RD_RELAY_HOST。
remote_desktop:
  enabled: true
  id_server: "192.168.1.10"          # hbbs 信令服务器（host 或 host:port）；文档保留地址，部署机替换为实际地址
  relay_server: "192.168.1.10"       # hbbr 中继服务器（host 或 host:port）；文档保留地址，部署机替换为实际地址
  ports: [21115, 21116, 21117, 21118, 21119]
  # 自托管 hbbs/hbbr 的密钥目录（id_ed25519 私钥 + id_ed25519.pub 公钥；权限 700/600）。
  key_dir: "/var/lib/neilico/rustdesk"
  # 留空则从 key_dir 派生 <key_dir>/id_ed25519.pub（推荐；也可显式指向别处的 .pub）。
  public_key_file: ""
  # 生命周期：on_demand（默认，无活动不监听、进程数 0）/ always_on（常驻）/ off（禁用）。
  server_mode: "on_demand"
  # on_demand 模式下的空闲回收阈值（无远程桌面活动超过该时长即自动停止）。
  idle_timeout: 10m
  # 自编译二进制路径（allinone 镜像装到 /usr/local/bin）。
  hbbs_path: "/usr/local/bin/hbbs"
  hbbr_path: "/usr/local/bin/hbbr"
  # hbbr 中继端口 / hbbs 的 UDP 端口（默认 21117 / 21116；一般无需改）。
  relay_port: 21117
  udp_port: 21116
  # 非空则以 `-r <relay_host>` 下发给 hbbs（显式告诉客户端中继地址）；留空则由客户端自动推导。
  relay_host: ""

log:
  level: info
  format: json
acme:
  enabled: false
  directory_url: "https://acme-v02.api.letsencrypt.org/directory"
  email: ""
  challenge: "http-01"
  http_port: 80
  renew_before_days: 30
  check_interval: "6h"
  key_type: "ec256"
  agree_tos: false
  auto_renew: true
  ca_cert_file: ""

proxy:
  enabled: true
  kind: builtin
  listen: ":8081"
  tls:
    enabled: false
    listen: ":8443"
    min_version: "1.2"
    redirect_http: true
    hsts_max_age: 31536000
  nps:
    config_path: "data/nps/config.json"
    binary_path: "/usr/bin/nps"
    pid_file: "data/nps/nps.pid"
    reload_strategy: "signal"
    crypt: true
    compress: true

alerts:
  evaluation_interval: 1m
  node_offline_after: 5m
  certificate_expiring_in: 720h
  certificate_critical_in: 168h
  p2p_success_rate_minimum: 0.60
  relay_spike_multiplier: 3
  relay_baseline_window: 24h
  resolved_retention: 168h
  webhook_url: ""
  webhook_timeout: 5s
  webhook_retries: 3
