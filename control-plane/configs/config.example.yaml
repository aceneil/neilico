server:
  host: "0.0.0.0"
  port: 8080
database:
  driver: postgres
  dsn: "postgres://umpp:change-me@localhost:5432/umpp?sslmode=disable"
auth:
  jwt_secret: "replace-with-a-long-random-secret"
  access_ttl: 15m
  refresh_ttl: 168h
bootstrap:
  admin_email: "admin@example.com"
  admin_password: "replace-with-a-strong-password"
  default_tenant: "default"
node:
  heartbeat_timeout: 60s
log:
  level: info
  format: json
acme:
  enabled: false
  directory_url: "https://acme-v02.api.letsencrypt.org/directory"
  email: ""
  challenge: "http-01"
  http_port: 80
  renew_before_days: 30
  check_interval: "6h"
  key_type: "ec256"
  agree_tos: false
  auto_renew: true
  ca_cert_file: ""

proxy:
  enabled: true
  kind: builtin
  listen: ":8081"
  tls:
    enabled: false
    listen: ":8443"
    min_version: "1.2"
  nps:
    config_path: "data/nps/config.json"
    binary_path: "/usr/bin/nps"
    pid_file: "data/nps/nps.pid"
    reload_strategy: "signal"
